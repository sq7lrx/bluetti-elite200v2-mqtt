version: '3.8'

# Docker Compose setup that uses the pre-built image from the GitHub Container Registry
# Usage: docker-compose -f docker-compose.prebuilt.yml up -d

services:
  bluetti-mqtt:
    # Uses the pre-built image from the GitHub Container Registry
    image: ghcr.io/jordigrasvi/bluetti-elite200v2-mqtt:latest
    container_name: bluetti-elite200v2-mqtt
    restart: unless-stopped
    
    # Access to the host's Bluetooth
    privileged: true
    network_mode: host
    
    # Environment variables - SET THESE VALUES!
    environment:
      - BLUETTI_MAC=XX:XX:XX:XX:XX:XX  # Replace with your MAC
      - MQTT_HOST=192.168.1.100        # Replace with your MQTT IP
      - MQTT_PORT=1883
      - MQTT_USERNAME=mqttuser          # Optional
      - MQTT_PASSWORD=mqttpass          # Optional
      - MQTT_TOPIC=bluetti
      - LOG_LEVEL=info
      - POLLING_INTERVAL=5              # Optional: interval in seconds
      - HA_CONFIG=normal                # normal, none, advanced
      - VERBOSE=false                   # true for detailed logs
    
    # Volumes for configuration and logs
    volumes:
      - ./config:/app/config:ro         # Mount encryption_keys.json here
      - ./logs:/app/logs:rw             # Application logs
      - /var/run/dbus:/var/run/dbus:ro  # D-Bus access for Bluetooth
    
    # Devices required for Bluetooth
    devices:
      - /dev/bus/usb:/dev/bus/usb       # USB Bluetooth adapters
    
    # Labels for organization
    labels:
      - "com.docker.compose.project=bluetti-elite200v2"
      - "com.docker.compose.service=mqtt-bridge"

  # Optional service for device discovery
  bluetti-discovery:
    image: ghcr.io/jordigrasvi/bluetti-elite200v2-mqtt:latest
    container_name: bluetti-discovery
    privileged: true
    network_mode: host
    command: bluetti-discovery
    
    volumes:
      - /var/run/dbus:/var/run/dbus:ro
    
    devices:
      - /dev/bus/usb:/dev/bus/usb
    
    profiles:
      - discovery  # Only runs with --profile discovery

  # Optional service for logging
  bluetti-logger:
    image: ghcr.io/jordigrasvi/bluetti-elite200v2-mqtt:latest
    container_name: bluetti-logger
    privileged: true
    network_mode: host
    command: bluetti-logger
    
    environment:
      - BLUETTI_MAC=XX:XX:XX:XX:XX:XX  # Replace with your MAC
      - LOG_FILE=/app/logs/device.log
    
    volumes:
      - ./config:/app/config:ro
      - ./logs:/app/logs:rw
      - /var/run/dbus:/var/run/dbus:ro
    
    devices:
      - /dev/bus/usb:/dev/bus/usb
    
    profiles:
      - logger  # Only runs with --profile logger
