# Same stack as docker-compose.yml, but pulls the published bridge image
# instead of building it from source.
#
#   docker compose -f docker-compose.prebuilt.yml up -d
#
# The dashboard has no published image yet, so it is still built locally.

name: bluetti-elite200v2

x-bluetooth: &bluetooth
  privileged: true
  network_mode: host
  volumes:
    - /var/run/dbus:/var/run/dbus:ro

services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: bluetti-mosquitto
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    environment:
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
    volumes:
      - ./mosquitto/docker-entrypoint.sh:/entrypoint.sh:ro
      - mosquitto-data:/mosquitto/data
    ports:
      - "127.0.0.1:${MQTT_PORT:-1883}:1883"
    networks:
      - bluetti

  bluetti-mqtt:
    image: ghcr.io/sq7lrx/bluetti-elite200v2-mqtt:latest
    container_name: bluetti-elite200v2-mqtt
    restart: unless-stopped
    <<: *bluetooth
    depends_on:
      - mosquitto
    environment:
      BLUETTI_MAC: ${BLUETTI_MAC:?set BLUETTI_MAC in .env}
      MQTT_HOST: 127.0.0.1
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      MQTT_TOPIC: ${MQTT_TOPIC:-bluetti}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      POLLING_INTERVAL: ${POLLING_INTERVAL:-5}
      HA_CONFIG: ${HA_CONFIG:-normal}
      VERBOSE: ${VERBOSE:-false}
    volumes:
      - /var/run/dbus:/var/run/dbus:ro
      - ./logs:/app/logs:rw

  dashboard:
    build:
      context: ./dashboard
    container_name: bluetti-dashboard
    restart: unless-stopped
    depends_on:
      - mosquitto
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      MQTT_TOPIC: ${MQTT_TOPIC:-bluetti}
      DASHBOARD_HISTORY_POINTS: ${DASHBOARD_HISTORY_POINTS:-360}
    ports:
      - "${DASHBOARD_PORT:-8787}:8787"
    networks:
      - bluetti

  bluetti-discovery:
    image: ghcr.io/sq7lrx/bluetti-elite200v2-mqtt:latest
    container_name: bluetti-discovery
    <<: *bluetooth
    command: bluetti-discovery
    profiles: [discovery]

  bluetti-logger:
    image: ghcr.io/sq7lrx/bluetti-elite200v2-mqtt:latest
    container_name: bluetti-logger
    <<: *bluetooth
    command: bluetti-logger
    environment:
      BLUETTI_MAC: ${BLUETTI_MAC:?set BLUETTI_MAC in .env}
      MQTT_HOST: 127.0.0.1
      LOG_FILE: /app/logs/device.log
    volumes:
      - /var/run/dbus:/var/run/dbus:ro
      - ./logs:/app/logs:rw
    profiles: [logger]

volumes:
  mosquitto-data:

networks:
  bluetti:
    driver: bridge
